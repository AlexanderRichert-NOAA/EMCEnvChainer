[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emcenvchainer"
version = "0.1.9"
description = "A TUI utility for creating test installations using Spack environment chaining"
readme = "README.md"
license = {text = "LGPL-3.0-only"}
authors = [
    {name = "Alex Richert"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]
keywords = ["spack", "hpc", "scientific-computing"]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "termcolor>=1.1.0",
    "ruamel.yaml>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]

[project.scripts]
emcenvchainer = "emcenvchainer.main:main"

[project.urls]
Homepage = "https://github.com/AlexanderRichert-NOAA/emcenvchainer"
Repository = "https://github.com/AlexanderRichert-NOAA/emcenvchainer.git"
Documentation = "https://github.com/AlexanderRichert-NOAA/emcenvchainer#readme"
"Bug Tracker" = "https://github.com/AlexanderRichert-NOAA/emcenvchainer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
